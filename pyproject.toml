[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kinetickit"
dynamic = ["version"]
description = "Domain-neutral engine for precise, deterministic 2D and 3D animation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "EconViz" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
raster = ["matplotlib>=3.7", "pillow>=10.0"]
interactive = ["plotly>=5.18"]
studio = ["matplotlib>=3.7", "pillow>=10.0", "plotly>=5.18"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "packaging>=23",
]

[tool.hatch.version]
path = "src/kinetickit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetickit"]

[tool.hatch.build.targets.sdist]
include = ["src/kinetickit", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["slow: long-running tests"]

[tool.coverage.run]
source = ["kinetickit"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF005", "RUF012", "RUF009", "B009", "B010", "E741"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kinetickit"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "plotly.*", "PIL.*", "glyphkit.*", "fontTools.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.importlinter]
root_package = "kinetickit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Motion core is renderer- and scene-free"
type = "forbidden"
source_modules = [
    "kinetickit.easing",
    "kinetickit.interpolation",
    "kinetickit.tween",
    "kinetickit.keyframes",
    "kinetickit.timeline",
]
forbidden_modules = [
    "kinetickit.geometry",
    "kinetickit.scene",
    "kinetickit.styles",
    "kinetickit.guides",
    "kinetickit.layout",
    "kinetickit.morph",
    "kinetickit.transitions",
    "kinetickit.animation",
    "kinetickit.typography",
    "kinetickit.interaction",
    "kinetickit.accessibility",
    "kinetickit.renderers",
    "kinetickit.exporters",
]

[[tool.importlinter.contracts]]
name = "Geometry is independent of scenes and renderers"
type = "forbidden"
source_modules = ["kinetickit.geometry"]
forbidden_modules = [
    "kinetickit.scene",
    "kinetickit.animation",
    "kinetickit.renderers",
    "kinetickit.exporters",
]

[[tool.importlinter.contracts]]
name = "Scenes do not know renderers or exporters"
type = "forbidden"
source_modules = [
    "kinetickit.scene",
    "kinetickit.styles",
    "kinetickit.guides",
    "kinetickit.layout",
    "kinetickit.morph",
    "kinetickit.transitions",
]
forbidden_modules = ["kinetickit.renderers", "kinetickit.exporters"]

[[tool.importlinter.contracts]]
name = "Renderers do not know exporters"
type = "forbidden"
source_modules = ["kinetickit.renderers"]
forbidden_modules = ["kinetickit.exporters"]

[[tool.importlinter.contracts]]
name = "Vector rendering does not know raster or interactive"
type = "forbidden"
source_modules = ["kinetickit.renderers.vector"]
forbidden_modules = ["kinetickit.renderers.raster", "kinetickit.renderers.interactive"]

[[tool.importlinter.contracts]]
name = "Raster rendering does not know vector or interactive"
type = "forbidden"
source_modules = ["kinetickit.renderers.raster"]
forbidden_modules = ["kinetickit.renderers.vector", "kinetickit.renderers.interactive"]

[[tool.importlinter.contracts]]
name = "Interactive rendering does not know raster"
type = "forbidden"
source_modules = ["kinetickit.renderers.interactive"]
forbidden_modules = ["kinetickit.renderers.raster"]

[[tool.importlinter.contracts]]
name = "Domain packages and optional backends stay out of the core"
type = "forbidden"
source_modules = [
    "kinetickit.easing",
    "kinetickit.interpolation",
    "kinetickit.tween",
    "kinetickit.keyframes",
    "kinetickit.timeline",
    "kinetickit.geometry",
    "kinetickit.scene",
    "kinetickit.styles",
    "kinetickit.guides",
    "kinetickit.layout",
    "kinetickit.morph",
    "kinetickit.transitions",
    "kinetickit.animation",
    "kinetickit.scheduler",
    "kinetickit.typography",
    "kinetickit.interaction",
    "kinetickit.accessibility",
    "kinetickit.renderers.vector",
]
forbidden_modules = ["matplotlib", "plotly", "PIL", "mosaickit", "bezierkit"]
